# Script Runner Configuration

# Workflow dispatch settings
workflow:
  # Refresh interval (seconds) for `gh run watch`, which blocks until the
  # run completes. Lower values give snappier live progress.
  poll_interval: 10

  # Maximum time to wait for workflow completion (in seconds)
  # Set to 0 for unlimited
  timeout: 3600

  # Stream `gh run watch` live progress to the terminal while waiting
  show_progress: true
